services:
  # Self-contained integration tests: server + tests in one container.
  # No host filesystem coupling — everything runs inside Docker.
  integration-tests:
    build:
      context: .
      dockerfile: Dockerfile.integration
    tmpfs:
      - /tmp
      - /data
    environment:
      - TZ=UTC
      - ARC_SERVER=http://127.0.0.1:7432
      - HOME=/tmp/arc-home
      - XDG_CONFIG_HOME=/tmp/arc-home/config
    profiles:
      - integration

  # Standalone server for playwright E2E tests (run from host).
  arc-test-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1::7432"
    tmpfs:
      - /data:uid=1000,gid=1000
      - /home/arc:uid=1000,gid=1000
    environment:
      - TZ=UTC
      - HOME=/home/arc
      - XDG_CONFIG_HOME=/home/arc/config
    command: ["--port", "7432", "--db", "/data/arc.db"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7432/health"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 3s
    profiles:
      - playwright
