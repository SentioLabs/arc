name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Lint is the cheap gate (~30s): it runs first and alone, and the three test
  # suites below all wait on it, so a style-only finding costs one short job
  # instead of the full matrix. Previously lint was the *last* step of
  # unit-tests, which meant tests had already run by the time it failed — it
  # burned the cycles it was meant to save and delayed lint feedback.
  #
  # This gate is only safe because `lint` is a required status check on main
  # (see the repository ruleset). A red lint therefore cannot merge, so it can
  # never skip the test suites on a main push — which is exactly how a symlink
  # regression went undetected across three merges before that rule existed.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run linter
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  unit-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Install jj
        run: |
          JJ_VERSION="v0.42.0"
          ARCHIVE="jj-${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          URL="https://github.com/jj-vcs/jj/releases/download/${JJ_VERSION}/${ARCHIVE}"
          for i in 1 2 3; do
            curl -sSfL "$URL" -o /tmp/jj.tar.gz && break
            echo "jj download attempt $i failed, retrying in 5s..."
            sleep 5
            [ "$i" = 3 ] && { echo "jj download failed after 3 attempts"; exit 1; }
          done
          mkdir -p /tmp/jj-extract
          tar -xzf /tmp/jj.tar.gz -C /tmp/jj-extract
          JJ_BIN="$(find /tmp/jj-extract -type f -name jj | head -n1)"
          test -n "$JJ_BIN" || { echo "jj binary not found in archive:"; tar -tzf /tmp/jj.tar.gz; exit 1; }
          install -m 0755 "$JJ_BIN" /usr/local/bin/jj
          jj --version

      - name: Run tests
        run: make test

  integration-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run integration tests
        run: make test-integration

  playwright-e2e:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: cd web && bun install

      - name: Install Playwright browsers
        run: |
          cd web
          for i in 1 2 3; do
            if bunx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "playwright install attempt $i failed, retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Run Playwright E2E tests
        run: make test-playwright
