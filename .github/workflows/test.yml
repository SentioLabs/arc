name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Lint is the cheap gate (~30s): it runs first and alone, and the three test
  # suites below all wait on it, so a style-only finding costs one short job
  # instead of the full matrix. Previously lint was the *last* step of
  # unit-tests, which meant tests had already run by the time it failed — it
  # burned the cycles it was meant to save and delayed lint feedback.
  #
  # This gate is only safe because `lint` is a required status check on main
  # (see the repository ruleset). A red lint therefore cannot merge, so it can
  # never skip the test suites on a main push — which is exactly how a symlink
  # regression went undetected across three merges before that rule existed.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Download dependencies
        run: task deps

      - name: Run linter
        run: task lint:go

  unit-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Run tests
        run: task test

  integration-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Run integration tests
        run: task test:integration

  playwright-e2e:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Install frontend dependencies
        run: cd web && bun install

      - name: Install Playwright browsers
        run: |
          cd web
          for i in 1 2 3; do
            if bunx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "playwright install attempt $i failed, retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Run Playwright E2E tests
        run: task test:playwright
