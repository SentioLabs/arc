components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Project ID
      schema:
        type: string

    IssueId:
      name: issueId
      in: path
      required: true
      description: Issue ID
      schema:
        type: string

    ActorHeader:
      name: X-Actor
      in: header
      description: User performing the action (defaults to "anonymous")
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    # ====================
    # Core Schemas
    # ====================
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Machine-readable error code when supplied

    Status:
      type: string
      enum:
        - open
        - in_progress
        - blocked
        - deferred
        - closed

    IssueType:
      type: string
      enum:
        - bug
        - feature
        - task
        - epic
        - chore
        - release
        - milestone

    DependencyType:
      type: string
      enum:
        - blocks
        - parent-child
        - related
        - discovered-from

    EventType:
      type: string
      enum:
        - created
        - updated
        - status_changed
        - commented
        - closed
        - reopened
        - dependency_added
        - dependency_removed
        - label_added
        - label_removed

    # ====================
    # Project Schemas
    # ====================
    Project:
      type: object
      required:
        - id
        - name
        - prefix
        - created_at
        - updated_at
        - governance_generation
      properties:
        governance_generation:
          type: integer
          format: int64
        id:
          type: string
          description: Unique project ID (e.g., "proj-a1b2")
        name:
          type: string
          description: Display name
          maxLength: 100
        path:
          type: string
          description: Optional associated directory path
        description:
          type: string
          description: Project description
        prefix:
          type: string
          description: Issue ID prefix (e.g., "bd")
          maxLength: 10
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateProjectRequest:
      type: object
      required:
        - name
        - prefix
      properties:
        name:
          type: string
          description: Display name
          maxLength: 100
        path:
          type: string
          description: Optional associated directory path
        description:
          type: string
          description: Project description
        prefix:
          type: string
          description: Issue ID prefix
          maxLength: 10

    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          description: New display name
          maxLength: 100
        path:
          type: string
          description: New associated directory path
        description:
          type: string
          description: New description

    ProjectConfig:
      type: object
      required:
        - config
      properties:
        config:
          type: object
          description: Per-project config key/value pairs
          additionalProperties:
            type: string

    SetProjectConfigRequest:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
          description: Config key
        value:
          type: string
          description: Config value

    Statistics:
      type: object
      required:
        - project_id
        - total_issues
        - open_issues
        - in_progress_issues
        - closed_issues
        - blocked_issues
        - deferred_issues
        - ready_issues
      properties:
        project_id:
          type: string
        total_issues:
          type: integer
        open_issues:
          type: integer
        in_progress_issues:
          type: integer
        closed_issues:
          type: integer
        blocked_issues:
          type: integer
        deferred_issues:
          type: integer
        ready_issues:
          type: integer
        avg_lead_time_hours:
          type: number
          format: double

    # ====================
    # Issue Schemas
    # ====================
    Issue:
      type: object
      required:
        - id
        - project_id
        - title
        - status
        - priority
        - issue_type
        - created_at
        - updated_at
        - contract_version
      properties:
        contract_version:
          type: integer
          format: int64
        governing_plan:
          $ref: "#/components/schemas/PlanReference"
        id:
          type: string
          description: Unique issue ID
        project_id:
          type: string
        title:
          type: string
          maxLength: 500
        description:
          type: string
        status:
          $ref: "#/components/schemas/Status"
        priority:
          type: integer
          minimum: 0
          maximum: 4
          description: "0 (critical) - 4 (backlog)"
        rank:
          type: integer
          description: "0 = unranked (sorts last), 1+ = lower rank = work on first"
        issue_type:
          $ref: "#/components/schemas/IssueType"
        ai_session_id:
          type: string
          description: AI coding session UUID (e.g., Claude Code session ID)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
        close_reason:
          type: string
        external_ref:
          type: string
          description: External reference (e.g., "gh-9", "jira-ABC")
        labels:
          type: array
          items:
            type: string
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/Dependency"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"

    IssueDetails:
      allOf:
        - $ref: "#/components/schemas/Issue"
        - type: object
          properties:
            resolved_governance:
              $ref: "#/components/schemas/GoverningPlan"
            dependents:
              type: array
              items:
                $ref: "#/components/schemas/Dependency"

    BlockedIssue:
      allOf:
        - $ref: "#/components/schemas/Issue"
        - type: object
          required:
            - blocked_by_count
            - blocked_by
          properties:
            blocked_by_count:
              type: integer
            blocked_by:
              type: array
              items:
                type: string

    PaginatedIssues:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    PaginatedAISessions:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AISessionResponse"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    # ====================
    # Team Context Schemas
    # ====================
    TeamContext:
      type: object
      required:
        - project
        - roles
      properties:
        project:
          type: string
          description: Project ID
        epic:
          $ref: "#/components/schemas/TeamContextEpic"
        roles:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/TeamContextRole"
          description: Issues grouped by teammate role name

    TeamContextEpic:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
        title:
          type: string

    TeamContextRole:
      type: object
      required:
        - issues
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/TeamContextIssue"

    TeamContextIssue:
      type: object
      required:
        - id
        - title
        - priority
        - status
        - type
      properties:
        id:
          type: string
        title:
          type: string
        priority:
          type: integer
          minimum: 0
          maximum: 4
        status:
          type: string
        type:
          type: string
        deps:
          type: array
          items:
            type: string
          description: IDs of issues this depends on

    CreateIssueRequest:
      description: Generic issue creation does not accept governing_plan. Attach pins through plan adoption.
      type: object
      required:
        - title
      properties:
        title:
          type: string
          maxLength: 500
        description:
          type: string
        status:
          $ref: "#/components/schemas/Status"
        priority:
          type: integer
          minimum: 0
          maximum: 4
          default: 2
        issue_type:
          $ref: "#/components/schemas/IssueType"
        ai_session_id:
          type: string
          description: AI coding session UUID
        external_ref:
          type: string

    UpdateIssueRequest:
      description: Generic updates cannot attach, replace or remove governing_plan. Use plan adoption.
      type: object
      properties:
        title:
          type: string
          maxLength: 500
        description:
          type: string
        status:
          $ref: "#/components/schemas/Status"
        priority:
          type: integer
          minimum: 0
          maximum: 4
        issue_type:
          $ref: "#/components/schemas/IssueType"
        ai_session_id:
          type: string
          description: AI coding session UUID
        external_ref:
          type: string

    CloseIssueRequest:
      type: object
      properties:
        reason:
          type: string
          description: Reason for closing

    # ====================
    # Dependency Schemas
    # ====================
    Dependency:
      type: object
      required:
        - issue_id
        - depends_on_id
        - type
        - created_at
      properties:
        issue_id:
          type: string
        depends_on_id:
          type: string
        type:
          $ref: "#/components/schemas/DependencyType"
        created_at:
          type: string
          format: date-time
        created_by:
          type: string

    DependencyGraph:
      type: object
      required:
        - dependencies
        - dependents
      properties:
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/Dependency"
        dependents:
          type: array
          items:
            $ref: "#/components/schemas/Dependency"

    AddDependencyRequest:
      type: object
      required:
        - depends_on_id
        - type
      properties:
        depends_on_id:
          type: string
          description: ID of the issue this depends on
        type:
          $ref: "#/components/schemas/DependencyType"

    # ====================
    # Label Schemas
    # ====================
    Label:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        color:
          type: string
          description: Hex color code (e.g., "#ff0000")
        description:
          type: string

    CreateLabelRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        color:
          type: string
        description:
          type: string

    UpdateLabelRequest:
      type: object
      properties:
        color:
          type: string
        description:
          type: string

    AddLabelToIssueRequest:
      type: object
      required:
        - label
      properties:
        label:
          type: string

    # ====================
    # Comment Schemas
    # ====================
    Comment:
      type: object
      required:
        - id
        - issue_id
        - author
        - text
        - created_at
      properties:
        id:
          type: integer
          format: int64
        issue_id:
          type: string
        author:
          type: string
        text:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AddCommentRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string

    UpdateCommentRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string

    # ====================
    # Event Schemas
    # ====================
    Event:
      type: object
      required:
        - id
        - issue_id
        - event_type
        - actor
        - created_at
      properties:
        id:
          type: integer
          format: int64
        issue_id:
          type: string
        event_type:
          $ref: "#/components/schemas/EventType"
        actor:
          type: string
        old_value:
          type: string
        new_value:
          type: string
        comment:
          type: string
        created_at:
          type: string
          format: date-time

    # ====================
    # AI Session Schemas
    # ====================
    AISessionResponse:
      type: object
      required:
        - id
        - project_id
        - transcript_path
        - started_at
      properties:
        id:
          type: string
          description: Unique AI session ID
        project_id:
          type: string
          description: Project ID this session belongs to
        transcript_path:
          type: string
          description: Path to the session transcript file
        cwd:
          type: string
          description: Working directory for the session
        started_at:
          type: string
          format: date-time
        agent_summary:
          type: object
          description: Aggregated agent status counts for this session
          properties:
            agent_count:
              type: integer
              description: Total number of agents in this session
            running_count:
              type: integer
              description: Number of agents currently running
            completed_count:
              type: integer
              description: Number of agents that completed successfully
            error_count:
              type: integer
              description: Number of agents that ended with an error

    CreateAISessionRequest:
      type: object
      required:
        - id
        - transcript_path
      properties:
        id:
          type: string
          description: AI session ID
        transcript_path:
          type: string
          description: Path to the session transcript file
        cwd:
          type: string
          description: Working directory for the session
        started_at:
          type: string
          format: date-time
          description: Session start time (defaults to current time)

    AIAgentResponse:
      type: object
      required:
        - id
        - session_id
        - status
        - created_at
      properties:
        id:
          type: string
          description: Unique AI agent ID
        session_id:
          type: string
          description: Parent session ID
        description:
          type: string
          description: Agent task description
        prompt:
          type: string
          description: Agent prompt text
        agent_type:
          type: string
          description: Type of agent (e.g., "task", "code")
        model:
          type: string
          description: AI model used
        status:
          type: string
          description: Agent status (running, completed, error)
        duration_ms:
          type: integer
          description: Duration in milliseconds
        total_tokens:
          type: integer
          description: Total tokens consumed
        tool_use_count:
          type: integer
          description: Number of tool uses
        created_at:
          type: string
          format: date-time

    CreateAIAgentRequest:
      type: object
      required:
        - id
        - session_id
      properties:
        id:
          type: string
          description: AI agent ID
        session_id:
          type: string
          description: Parent session ID
        description:
          type: string
          description: Agent task description
        prompt:
          type: string
          description: Agent prompt text
        agent_type:
          type: string
          description: Type of agent
        model:
          type: string
          description: AI model used
        status:
          type: string
          description: Agent status (defaults to "running")

    BatchDeleteAISessionsRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: string
          description: List of AI session IDs to delete

    BatchDeleteAISessionsResponse:
      type: object
      properties:
        deleted:
          type: integer
          description: Number of sessions deleted

    TranscriptResponse:
      type: array
      items:
        type: object
        additionalProperties: true
      description: Array of transcript entries

    # ====================
    # Config Schemas
    # ====================
    Config:
      type: object
      required: [cli, server, updates]
      properties:
        cli:
          $ref: "#/components/schemas/CLIConfig"
        server:
          $ref: "#/components/schemas/ServerConfig"
        updates:
          $ref: "#/components/schemas/UpdatesConfig"

    CLIConfig:
      type: object
      properties:
        server:
          type: string
          description: URL the CLI uses to talk to the arc server.

    ServerConfig:
      type: object
      properties:
        port:
          type: integer
          minimum: 1
          maximum: 65535
        db_path:
          type: string

    UpdatesConfig:
      type: object
      properties:
        channel:
          type: string
          enum: [stable, rc, nightly]

    ConfigResponse:
      type: object
      required: [cli, server, updates, meta]
      allOf:
        - $ref: "#/components/schemas/Config"
        - type: object
          properties:
            meta:
              type: object
              required: [path, requires_restart]
              properties:
                path:
                  type: string
                requires_restart:
                  type: array
                  items:
                    type: string

    ConfigValidationError:
      type: object
      required: [errors]
      properties:
        errors:
          type: object
          additionalProperties:
            type: string

    # Durable plans, review concurrency, and governed-work contracts.
    PlanStatus:
      type: string
      enum:
      - draft
      - in_review
      - approved
      - rejected
      - changes_requested
    Plan:
      type: object
      required:
      - id
      - project_id
      - title
      - lifecycle
      - head_revision
      - version
      - feedback_version
      - created_at
      - updated_at
      properties:
        id:
          type: string
        project_id:
          type: string
        title:
          type: string
        lifecycle:
          type: string
          enum:
          - active
          - archived
        head_revision:
          type: integer
          format: int64
          minimum: 0
        version:
          type: integer
          format: int64
          minimum: 0
        feedback_version:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PlanWithContent:
      description: Deprecated legacy compatibility alias. Use PlanRevisionWithContent for retained bytes.
      allOf:
        - $ref: '#/components/schemas/LegacyPlanWithContent'

    PlanCommentAnchor:
      type: object
      description: Pins a comment to a quoted text range in the rendered document.
      required:
      - line_start
      - line_end
      - quoted_text
      - occurrence
      properties:
        line_start:
          type: integer
          description: First source line of the selection's enclosing block span
        line_end:
          type: integer
          description: Last source line of the selection's enclosing block span
        quoted_text:
          type: string
          description: Exact rendered text selected (from selection.toString())
        occurrence:
          type: integer
          description: 0-based index among identical quotes in the rendered document
        heading_slug:
          type: string
          description: Slug of the nearest heading at or above the selection
        context_before:
          type: string
          description: Up to 64 rendered chars immediately before the selection
        context_after:
          type: string
          description: Up to 64 rendered chars immediately after the selection
    PlanReviewEvent:
      type: object
      required:
      - id
      - plan_id
      - revision
      - status
      - review_version
      - feedback_version
      - dispositions
      - created_at
      - actor
      - session_id
      properties:
        id:
          type: string
        plan_id:
          type: string
        revision:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - in_review
          - approved
          - rejected
          - changes_requested
        review_version:
          type: integer
          format: int64
        feedback_version:
          type: integer
          format: int64
        dispositions:
          type: array
          description: Exact immutable dispositions referenced by this decision, in retained order.
          items:
            $ref: '#/components/schemas/PlanFeedbackDisposition'
        created_at:
          type: string
          format: date-time
        actor:
          type: string
          description: Caller-supplied attribution, not authenticated identity; empty when unavailable.
        session_id:
          type: string
          description: Caller-supplied attribution, not authenticated identity; empty when unavailable.
    PlanCommentVersion:
      type: object
      required:
      - comment
      - created_at
      - actor
      - session_id
      properties:
        comment:
          $ref: '#/components/schemas/PlanComment'
        created_at:
          type: string
          format: date-time
        actor:
          type: string
          description: Caller-supplied attribution, not authenticated identity; empty when unavailable.
        session_id:
          type: string
          description: Caller-supplied attribution, not authenticated identity; empty when unavailable.
    PlanComment:
      type: object
      required:
      - id
      - plan_id
      - content
      - created_at
      - revision
      - version
      properties:
        id:
          type: string
        plan_id:
          type: string
        line_number:
          type: integer
          nullable: true
          description: Line number anchor (null for overall feedback; mirrors anchor.line_start when anchored)
        content:
          type: string
        anchor:
          $ref: '#/components/schemas/PlanCommentAnchor'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
        revision:
          type: integer
          format: int64
          nullable: true
          description: Exact revision; null only for migrated legacy discussion with unknown provenance.
        version: &id002
          type: integer
          format: int64
          minimum: 0
        deleted_at:
          type: string
          format: date-time
    CreatePlanRequest:
      type: object
      required:
      - file_path
      properties:
        file_path:
          type: string
    UpdatePlanContentRequest:
      type: object
      required:
      - content
      properties:
        content:
          type: string
    UpdatePlanStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/PlanStatus'
    CreatePlanCommentRequest:
      type: object
      required:
      - content
      properties:
        line_number:
          type: integer
          nullable: true
        content:
          type: string
        anchor:
          $ref: '#/components/schemas/PlanCommentAnchor'
    UpdatePlanCommentRequest:
      type: object
      description: 'Partial update. anchor omitted/null = unchanged; anchor object = full replace (line_number is re-mirrored
        from anchor.line_start). resolved true/false sets/clears resolved_at.

        '
      properties:
        content:
          type: string
        anchor:
          $ref: '#/components/schemas/PlanCommentAnchor'
        resolved:
          type: boolean
    LegacyPlan:
      type: object
      required:
      - id
      - file_path
      - status
      - created_at
      - updated_at
      properties:
        id:
          type: string
          description: Unique plan ID (plan.xxxxx format)
        file_path:
          type: string
          description: Relative path to the plan markdown file
        status:
          $ref: '#/components/schemas/PlanStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      description: Preserved legacy inventory metadata; status is unverified and paths are never dereferenced by HTTP.
    LegacyPlanInventory:
      allOf:
      - $ref: '#/components/schemas/LegacyPlan'
      - type: object
        required: [comments]
        properties:
          imported_project_id:
            type: string
            description: Durable project assignment after explicit import, absent while pending
          comments:
            type: array
            description: Preserved legacy discussion; revision is null and original anchors do not prove reviewed bytes
            items:
              $ref: '#/components/schemas/PlanComment'
    LegacyPlanWithContent:
      allOf:
      - $ref: '#/components/schemas/LegacyPlan'
      - type: object
        required:
        - content
        properties:
          content: &id001
            type: string
    PlanReference:
      type: object
      required:
      - plan_id
      - revision
      properties:
        plan_id:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 0
    PlanRevision:
      type: object
      required:
      - plan_id
      - revision
      - content_sha256
      - content_bytes
      - review_status
      - review_version
      - created_at
      properties:
        plan_id:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 0
        content_sha256:
          type: string
        content_bytes:
          type: integer
          format: int64
          minimum: 0
        review_status:
          $ref: '#/components/schemas/PlanStatus'
        review_version:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
    PlanRevisionWithContent:
      allOf:
      - $ref: '#/components/schemas/PlanRevision'
      - type: object
        required:
        - content
        properties:
          content:
            type: string
            description: Exact retained UTF-8 upload, verified against content_sha256 and content_bytes.
    GoverningPlan:
      type: object
      required:
      - container_id
      - container_type
      - reference
      - context
      properties:
        container_id:
          type: string
        container_type:
          $ref: '#/components/schemas/IssueType'
        reference:
          $ref: '#/components/schemas/PlanReference'
        context:
          type: array
          items:
            $ref: '#/components/schemas/GoverningPlanContext'
    GoverningPlanContext:
      type: object
      required:
      - container_id
      - container_type
      - reference
      properties:
        container_id:
          type: string
        container_type:
          $ref: '#/components/schemas/IssueType'
        reference:
          $ref: '#/components/schemas/PlanReference'
    ExpectedGovernance:
      type: object
      required:
      - governing
      - contract_version
      properties:
        governing:
          allOf:
          - $ref: '#/components/schemas/GoverningPlan'
          nullable: true
        contract_version:
          type: integer
          format: int64
          minimum: 0
      description: Required keys distinguish absent/null from explicit unlinked state. Shared governed-work contract.
    PlanReviewRequest:
      type: object
      required:
      - status
      - expected_head
      - expected_review_version
      - expected_feedback_version
      properties:
        status:
          type: string
          enum:
          - in_review
          - approved
          - rejected
          - changes_requested
        expected_head:
          type: integer
          format: int64
          minimum: 0
        expected_review_version:
          type: integer
          format: int64
          minimum: 0
        expected_feedback_version:
          type: integer
          format: int64
          minimum: 0
    PlanFeedbackDisposition:
      type: object
      required:
      - id
      - plan_id
      - target_revision
      - comment_id
      - comment_version
      - disposition
      - reason
      - created_at
      properties:
        id:
          type: string
        plan_id:
          type: string
        target_revision:
          type: integer
          format: int64
          minimum: 0
        comment_id:
          type: string
        comment_version:
          type: integer
          format: int64
          minimum: 0
        disposition:
          type: string
        reason:
          type: string
        created_at:
          type: string
          format: date-time
    ExecutionEvidenceRequest:
      type: object
      required:
      - expected
      - phase
      - evidence
      properties:
        expected:
          allOf:
          - $ref: '#/components/schemas/ExpectedGovernance'
          nullable: true
        phase:
          type: string
        evidence:
          type: string
      description: Required keys distinguish absent/null from explicit unlinked state. Shared governed-work contract.
    ReconciledTask:
      type: object
      required:
      - issue_id
      - expected
      - disposition
      - reason
      - follow_up_keys
      properties:
        issue_id:
          type: string
        expected:
          $ref: '#/components/schemas/ExpectedGovernance'
        disposition:
          type: string
        reason:
          type: string
        title:
          type: string
        description:
          type: string
        follow_up_keys:
          type: array
          items:
            type: string
    ReconciliationFollowUp:
      type: object
      required:
      - key
      - parent_id
      - title
      - description
      - issue_type
      - priority
      properties:
        key:
          type: string
        parent_id:
          type: string
        title:
          type: string
        description:
          type: string
        issue_type:
          $ref: '#/components/schemas/IssueType'
        priority:
          type: integer
          format: int64
          minimum: 0
    ReconciliationEdge:
      type: object
      required:
      - issue_id
      - depends_on_id
      - type
      - remove
      properties:
        issue_id:
          type: string
        depends_on_id:
          type: string
        type:
          $ref: '#/components/schemas/DependencyType'
        remove:
          type: boolean
    ReconciliationTypeChange:
      type: object
      required:
      - issue_id
      - expected_contract_version
      - issue_type
      properties:
        issue_id:
          type: string
        expected_contract_version:
          type: integer
          format: int64
          minimum: 0
        issue_type:
          $ref: '#/components/schemas/IssueType'
    ReconciledContainerPin:
      type: object
      required:
      - container_id
      - expected_container_version
      - expected_pin
      - target_pin
      - disposition
      - reason
      properties:
        container_id:
          type: string
        expected_container_version:
          type: integer
          format: int64
          minimum: 0
        expected_pin:
          allOf:
          - $ref: '#/components/schemas/PlanReference'
          nullable: true
        target_pin:
          allOf:
          - $ref: '#/components/schemas/PlanReference'
          nullable: true
        disposition:
          type: string
        reason:
          type: string
    PlanAdoptionRequest:
      type: object
      required:
      - expected_container_version
      - expected_governance_generation
      - expected_pin
      - target_pin
      - tasks
      - container_pins
      - follow_ups
      - edges
      - type_changes
      - dry_run
      properties:
        expected_container_version:
          type: integer
          format: int64
          minimum: 0
        expected_governance_generation:
          type: integer
          format: int64
          minimum: 0
        expected_pin:
          allOf:
          - $ref: '#/components/schemas/PlanReference'
          nullable: true
        target_pin:
          allOf:
          - $ref: '#/components/schemas/PlanReference'
          nullable: true
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/ReconciledTask'
        container_pins:
          type: array
          items:
            $ref: '#/components/schemas/ReconciledContainerPin'
        follow_ups:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationFollowUp'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationEdge'
        type_changes:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationTypeChange'
        dry_run:
          type: boolean
      description: Required keys distinguish absent/null from explicit unlinked state. Shared governed-work contract.
    PlanUpload:
      type: object
      required:
      - content
      properties:
        title: *id001
        content: *id001
        source_name: *id001
    PlanSave:
      type: object
      required:
      - content
      - expected_revision
      properties:
        content: *id001
        source_name: *id001
        expected_revision: *id002
    PlanWriteResult:
      type: object
      required:
      - plan
      - revision
      - replay
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
        revision:
          $ref: '#/components/schemas/PlanRevisionWithContent'
        replay:
          type: boolean
          description: True returns the originally committed result, even after later saves or archive.
    PlanMetadataUpdate:
      type: object
      required:
      - expected_version
      properties:
        title: *id001
        lifecycle:
          type: string
          enum:
          - active
          - archived
        expected_version: *id002
    PlanCommentUpdate:
      type: object
      required:
      - expected_version
      properties:
        content: *id001
        anchor:
          $ref: '#/components/schemas/PlanCommentAnchor'
        reopen:
          type: boolean
        expected_version: *id002
    PlanCommentDelete:
      type: object
      required:
      - expected_version
      properties:
        expected_version: *id002
    PlanDispositionRequest:
      type: object
      required:
      - comment_id
      - expected_comment_version
      - expected_feedback_version
      - disposition
      - reason
      properties:
        comment_id: *id001
        expected_comment_version: *id002
        expected_feedback_version: *id002
        disposition:
          type: string
          enum:
          - addressed
          - deferred
        reason:
          type: string
          minLength: 1
