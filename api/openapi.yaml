openapi: 3.0.3
info:
  title: Arc Issue Tracker API
  description: |
    Central issue tracking server for AI-assisted coding workflows.
    Arc provides project-scoped issue management with dependency tracking,
    labels, comments, and audit trails.
  version: 1.0.0
  contact:
    name: SentioLabs
    url: https://github.com/sentiolabs/arc

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: projects
    description: Project management
  - name: issues
    description: Issue CRUD and lifecycle operations
  - name: ready
    description: Ready work queue and blocked issues
  - name: dependencies
    description: Issue dependency management
  - name: labels
    description: Label management
  - name: config
    description: Arc configuration management
  - name: comments
    description: Comments and audit events
  - name: teams
    description: Agent team context and role grouping
  - name: ai-sessions
    description: AI session and agent observability
  - name: plans
    description: Ephemeral plan review artifacts

paths:
  # ====================
  # Projects
  # ====================
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"

    get:
      operationId: getProject
      tags: [projects]
      summary: Get project by ID
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      operationId: updateProject
      tags: [projects]
      summary: Update project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete project
      responses:
        "204":
          description: Project deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/stats:
    parameters:
      - $ref: "#/components/parameters/ProjectId"

    get:
      operationId: getProjectStats
      tags: [projects]
      summary: Get project statistics
      responses:
        "200":
          description: Project statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Statistics"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/config:
    parameters:
      - $ref: "#/components/parameters/ProjectId"

    get:
      operationId: getProjectConfig
      tags: [projects]
      summary: Get all per-project config key/value pairs
      responses:
        "200":
          description: Project config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectConfig"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      operationId: setProjectConfig
      tags: [projects]
      summary: Upsert one per-project config key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetProjectConfigRequest"
      responses:
        "200":
          description: Config key set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetProjectConfigRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/config/{key}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: key
        in: path
        required: true
        description: Config key
        schema:
          type: string

    delete:
      operationId: deleteProjectConfig
      tags: [projects]
      summary: Delete one per-project config key
      responses:
        "200":
          description: Config key deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: string
                    description: The deleted config key
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ====================
  # Issues
  # ====================
  /projects/{projectId}/issues:
    parameters:
      - $ref: "#/components/parameters/ProjectId"

    get:
      operationId: listIssues
      tags: [issues]
      summary: List issues in project
      parameters:
        - name: status
          in: query
          description: Filter by status (supports multiple values)
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Status"
          style: form
          explode: true
        - name: type
          in: query
          description: Filter by issue type (supports multiple values)
          schema:
            type: array
            items:
              $ref: "#/components/schemas/IssueType"
          style: form
          explode: true
        - name: priority
          in: query
          description: Filter by priority (supports multiple values, 0-4)
          schema:
            type: array
            items:
              type: integer
              minimum: 0
              maximum: 4
          style: form
          explode: true
        - name: ai_session_id
          in: query
          description: Filter by AI session ID
          schema:
            type: string
        - name: parent_id
          in: query
          required: false
          description: Filter by parent issue ID (returns children via parent-child dependency)
          schema:
            type: string
        - name: q
          in: query
          description: Full-text search query
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum results to return
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
        - name: offset
          in: query
          description: Pagination offset
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Paginated list of issues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedIssues"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createIssue
      tags: [issues]
      summary: Create a new issue
      parameters:
        - $ref: "#/components/parameters/ActorHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssueRequest"
      responses:
        "201":
          description: Issue created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /issues/{issueId}:
    parameters:
      - $ref: "#/components/parameters/IssueId"

    get:
      operationId: getIssueByID
      tags: [issues]
      summary: Get issue by globally-unique ID
      description: >
        Retrieves an issue by its globally-unique ID without requiring project context.
        Use this endpoint when you have an issue ID but don't know or need the project.
      parameters:
        - name: details
          in: query
          description: Include full details (dependencies, comments, labels)
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Issue details
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Issue"
                  - $ref: "#/components/schemas/IssueDetails"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Governance is cyclic, ambiguous, or requires reconciliation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      operationId: updateIssueByID
      tags: [issues]
      summary: Update issue by globally-unique ID
      parameters:
        - $ref: "#/components/parameters/ActorHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIssueRequest"
      responses:
        "200":
          description: Issue updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueDetails"
        "409":
          description: Governance mutation requires reconciliation or children remain open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"


  /projects/{projectId}/issues/{issueId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/IssueId"

    get:
      operationId: getIssue
      tags: [issues]
      summary: Get issue by ID within a project
      description: >
        Retrieves an issue by ID within a project-scoped route. Validates the
        issue belongs to the specified project.
      parameters:
        - name: details
          in: query
          description: Include full details (dependencies, comments, labels)
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Issue details
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Issue"
                  - $ref: "#/components/schemas/IssueDetails"
        "403":
          description: Access denied (issue does not belong to project)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Governance is cyclic, ambiguous, or requires reconciliation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      operationId: updateIssue
      tags: [issues]
      summary: Update issue
      parameters:
        - $ref: "#/components/parameters/ActorHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIssueRequest"
      responses:
        "200":
          description: Issue updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueDetails"
        "409":
          description: Governance mutation requires reconciliation or children remain open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteIssue
      tags: [issues]
      summary: Delete issue
      responses:
        "204":
          description: Issue deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Governance is cyclic, ambiguous, or requires reconciliation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/issues/{issueId}/governing-plan:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/IssueId"
    get:
      operationId: resolveGoverningPlan
      tags: [issues]
      summary: Resolve the complete pinned governing design chain
      description: Returns null for a valid unlinked issue. Cyclic or incomparable ancestry returns a distinct conflict code. Pins never follow the plan head.
      responses:
        "200":
          description: Governing chain, or null when unlinked
          content:
            application/json:
              schema:
                nullable: true
                allOf:
                  - $ref: "#/components/schemas/GoverningPlan"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: ambiguous_governance or governance_cycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects/{projectId}/issues/{issueId}/close:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/IssueId"

    post:
      operationId: closeIssue
      tags: [issues]
      summary: Close an issue
      parameters:
        - $ref: "#/components/parameters/ActorHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseIssueRequest"
      responses:
        "200":
          description: Issue closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/issues/{issueId}/reopen:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/IssueId"

    post:
      operationId: reopenIssue
      tags: [issues]
      summary: Reopen a closed issue
      parameters:
        - $ref: "#/components/parameters/ActorHeader"
      responses:
        "200":
          description: Issue reopened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ====================
  # Ready & Blocked
  # ====================
  /projects/{projectId}/ready:
    parameters:
      - $ref: "#/components/parameters/ProjectId"

    get:
      operationId: getReadyWork
      tags: [ready]
      summary: Get issues ready to work on (no blocking dependencies)
      parameters:
        - name: type
          in: query
          description: Filter by issue type
          schema:
            $ref: "#/components/schemas/IssueType"
        - name: priority
          in: query
          description: Filter by priority (0-4)
          schema:
            type: integer
            minimum: 0
            maximum: 4
        - name: limit
          in: query
          description: Maximum results to return
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
        - name: sort
          in: query
          description: |
            Sort policy for ready issues:
            - hybrid (default): Recent issues (<48h) sorted by priority/rank, older issues by age
            - priority: Always sort by priority → rank → created_at
            - oldest: Always sort by created_at (oldest first, for backlog clearing)
          schema:
            type: string
            enum: [hybrid, priority, oldest]
            default: hybrid
      responses:
        "200":
          description: List of ready issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Issue"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/blocked:
    parameters:
      - $ref: "#/components/parameters/ProjectId"

    get:
      operationId: getBlockedIssues
      tags: [ready]
      summary: Get blocked issues
      parameters:
        - name: limit
          in: query
          description: Maximum results to return
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: List of blocked issues with blocking info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlockedIssue"
        "500":
          $ref: "#/components/responses/InternalError"

  # ====================
  # Team Context
  # ====================
  /projects/{projectId}/team-context:
    parameters:
      - $ref: "#/components/parameters/ProjectId"

    get:
      operationId: getTeamContext
      tags: [teams]
      summary: Get issues grouped by teammate role labels
      description: |
        Returns issues grouped by their `teammate:*` labels. When an epic_id is
        provided, only children of that epic (via parent-child dependency) are
        included. Without epic_id, all non-closed issues with teammate labels
        in the project are returned.
      parameters:
        - name: epic_id
          in: query
          description: Optional epic ID to scope to children of a specific epic
          schema:
            type: string
      responses:
        "200":
          description: Team context with issues grouped by role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamContext"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ====================
  # AI Sessions
  # ====================
  /projects/{projectId}/ai/sessions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"

    get:
      operationId: listAISessions
      tags: [ai-sessions]
      summary: List AI sessions for a project
      parameters:
        - name: limit
          in: query
          description: Maximum results to return
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
        - name: offset
          in: query
          description: Pagination offset
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Paginated list of AI sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAISessions"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createAISession
      tags: [ai-sessions]
      summary: Create a new AI session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAISessionRequest"
      responses:
        "200":
          description: Existing AI session in the same project (metadata preserved)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISessionResponse"
        "201":
          description: AI session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Session ID already belongs to another project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Working directory does not resolve to the requested project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/ai/sessions/batch-delete:
    parameters:
      - $ref: "#/components/parameters/ProjectId"

    post:
      operationId: batchDeleteAISessions
      tags: [ai-sessions]
      summary: Batch delete AI sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchDeleteAISessionsRequest"
      responses:
        "200":
          description: Batch delete result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchDeleteAISessionsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/ai/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: sessionId
        in: path
        required: true
        description: AI session ID
        schema:
          type: string

    get:
      operationId: getAISession
      tags: [ai-sessions]
      summary: Get AI session by ID
      responses:
        "200":
          description: AI session details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISessionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteAISession
      tags: [ai-sessions]
      summary: Delete AI session
      responses:
        "204":
          description: AI session deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/ai/sessions/{sessionId}/transcript:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: sessionId
        in: path
        required: true
        description: AI session ID
        schema:
          type: string

    get:
      operationId: getSessionTranscript
      tags: [ai-sessions]
      summary: Get AI session transcript
      responses:
        "200":
          description: Session transcript content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/ai/sessions/{sessionId}/agents:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: sessionId
        in: path
        required: true
        description: AI session ID
        schema:
          type: string

    get:
      operationId: listAIAgents
      tags: [ai-sessions]
      summary: List AI agents for a session
      responses:
        "200":
          description: List of AI agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AIAgentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createAIAgent
      tags: [ai-sessions]
      summary: Create a new AI agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAIAgentRequest"
      responses:
        "201":
          description: AI agent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIAgentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/ai/sessions/{sessionId}/agents/{agentId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: sessionId
        in: path
        required: true
        description: AI session ID
        schema:
          type: string
      - name: agentId
        in: path
        required: true
        description: AI agent ID
        schema:
          type: string

    get:
      operationId: getAIAgent
      tags: [ai-sessions]
      summary: Get AI agent by ID
      responses:
        "200":
          description: AI agent details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIAgentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/ai/sessions/{sessionId}/agents/{agentId}/transcript:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: sessionId
        in: path
        required: true
        description: AI session ID
        schema:
          type: string
      - name: agentId
        in: path
        required: true
        description: AI agent ID
        schema:
          type: string

    get:
      operationId: getAgentTranscript
      tags: [ai-sessions]
      summary: Get AI agent transcript
      responses:
        "200":
          description: Agent transcript content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ====================
  # Dependencies
  # ====================
  /projects/{projectId}/issues/{issueId}/deps:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/IssueId"

    get:
      operationId: getDependencies
      tags: [dependencies]
      summary: Get issue dependencies and dependents
      responses:
        "200":
          description: Dependencies and dependents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DependencyGraph"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: addDependency
      tags: [dependencies]
